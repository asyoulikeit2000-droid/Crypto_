name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
      - run: npm run check:migration
      - run: node --check server.mjs
      - run: node --check intelligence-engine.mjs
      - run: node --check universe-engine.mjs
      - run: node --check signal-gates.mjs
      - run: node --check public/app.js
      - run: npm test
